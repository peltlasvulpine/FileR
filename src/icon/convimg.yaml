palettes:
  - name: mypalette
    fixed-entries:
      - color: {index: 7, r: 255, g: 0, b: 255}
    images: automatic

converts:
  - name: icons
    palette: mypalette
    transparent-index: 7
    style: rlet
    images:
      - iconsImages/*.png
outputs:
  - type: c
    include-file: gfx.h
    palettes:
      - mypalette
    converts:
      - icons
